                $ref: '#/components/schemas/Staff'
          description: ''
    patch:
      operationId: v1_staff_me_partial_update
      description: 설계문서 7.4절 — GET/PATCH /staff/me. 3.2-a.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
