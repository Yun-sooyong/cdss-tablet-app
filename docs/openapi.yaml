openapi: 3.0.3
info:
  title: medical-ai-platform API
  version: 0.1.0
  description: CDSS 백엔드 API. 세로 슬라이스(로그인~job 조회) 우선 구현.
paths:
  /api/v1/analysis/batches/:
    get:
      operationId: v1_analysis_batches_list
      description: 설계문서 3.2-b — 본인 batch + 공유받은 batch.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
          description: ''
    post:
      operationId: v1_analysis_batches_create
      description: 설계문서 3.2-b — 본인 batch + 공유받은 batch.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/v1/analysis/batches/{batch_id}/:
    get:
      operationId: v1_analysis_batches_retrieve
      description: |-
        설계문서 7.4절 — 배치 상세 (job 목록 포함) / 삭제. 본인 + 공유받은 batch만 조회,
        삭제는 본인 것만.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
    delete:
      operationId: v1_analysis_batches_destroy
      description: 리스트에서 삭제 — 설계문서 3.2-i. 물리 삭제 아니라 soft delete.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/analysis/batches/{batch_id}/images/:
    post:
      operationId: v1_analysis_batches_images_create
      description: |-
        POST /batches/{id}/images/. UploadSignedUrlView와 동일 로직 —
        저희가 먼저 만든 nested 경로, 설계문서엔 독립 경로(/uploads/signed-url)로
        돼 있어서 그것도 별도로 만들어뒀다. 둘 다 남겨둠(하위호환).
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
          description: ''
  /api/v1/analysis/batches/{batch_id}/shares/:
    get:
      operationId: v1_analysis_batches_shares_list
      description: 설계문서 7.4절 — 공유. 소유자만 공유를 만들거나 현황을 볼 수 있다.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisShare'
          description: ''
    post:
      operationId: v1_analysis_batches_shares_create
      description: 설계문서 7.4절 — 공유. 소유자만 공유를 만들거나 현황을 볼 수 있다.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisShareCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalysisShareCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalysisShareCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisShare'
          description: ''
  /api/v1/analysis/batches/{batch_id}/start/:
    post:
      operationId: v1_analysis_batches_start_create
      description: |-
        설계문서 7.4절 — POST /batches/{id}/start. 분석 시작.

        batch에 등록된 이미지 중 아직 job이 없는 것들에 대해 한 번에 job을
        만들어 큐에 등록한다 (기존 POST /images/{id}/jobs/는 이미지 하나씩
        개별 등록하는 하위 경로로 계속 남겨둠).
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchStart'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/v1/analysis/images/{image_id}/jobs/:
    post:
      operationId: v1_analysis_images_jobs_create
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobCreate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/analysis/internal/workers/heartbeat/:
    post:
      operationId: v1_analysis_internal_workers_heartbeat_create
      description: 설계문서 7.5절/2.5절 — POST /internal/workers/heartbeat. 워커 생존 신고.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeat'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/analysis/jobs/{job_id}/:
    get:
      operationId: v1_analysis_jobs_retrieve
      description: 본인 batch + 공유받은 batch의 job만 조회 가능.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/analysis/jobs/{job_id}/callback/:
    post:
      operationId: v1_analysis_jobs_callback_create
      description: 워커가 결과를 보고하는 엔드포인트. 환자 정보는 담기지 않는다 (README 6절).
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCallback'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobCallback'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobCallback'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/analysis/model-versions/:
    get:
      operationId: v1_analysis_model_versions_list
      description: 업로드 화면의 '모델 선택' 드롭다운용 — 활성 모델 버전 목록.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelVersion'
          description: ''
  /api/v1/analysis/shares/{share_id}/:
    delete:
      operationId: v1_analysis_shares_destroy
      description: 설계문서 7.4절 — 공유 회수. revoked_at 기록(물리 삭제 아님).
      parameters:
      - in: path
        name: share_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/invitations/redeem/:
    post:
      operationId: v1_auth_invitations_redeem_create
      description: 초대코드로 의료진 가입 — 로그인 불필요.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRedeem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationRedeem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationRedeem'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/login/refresh/:
    post:
      operationId: v1_auth_login_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: 설계문서 7.2절 — POST /auth/logout. refresh 토큰 폐기(blacklist).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/devices/tokens/:
    post:
      operationId: v1_devices_tokens_create
      description: 설계문서 7.4절/9장 — POST /devices/tokens. FCM 토큰 등록.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceToken'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
          description: ''
  /api/v1/medications/logs/:
    post:
      operationId: v1_medications_logs_create
      description: 설계문서 7.3절 — POST /medications/logs. 복용 체크(dose_log 생성).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationLogCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MedicationLogCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MedicationLogCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoseLog'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: v1_notifications_list
      description: 설계문서 7.4절/3.2-f — GET /notifications. 본인 알림만.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/patients/me/:
    get:
      operationId: v1_patients_me_retrieve
      description: 설계문서 7.3절 — 환자 본인 데이터로만 제한.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
    patch:
      operationId: v1_patients_me_partial_update
      description: 설계문서 7.3절 — 환자 본인 데이터로만 제한.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
    delete:
      operationId: v1_patients_me_destroy
      description: |-
        회원탈퇴 — 설계문서 12장: is_active=false + 식별정보 가명처리,
        진료기록 본체는 보존(soft delete).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/patients/me/medications/schedule/:
    get:
      operationId: v1_patients_me_medications_schedule_retrieve
      description: |-
        설계문서 7.3절 — GET /patients/me/medications/schedule. 3.1-d, 3.1-e.

        복약 캘린더(스케줄 목록) + 처방약 단위 잔량 %.
        잔량 % = (처방 총량 - 복용 기록) / 처방 총량 (설계문서 6.6절).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/patients/me/prescriptions/:
    get:
      operationId: v1_patients_me_prescriptions_list
      description: 설계문서 7.3절 — GET /patients/me/prescriptions. 3.1-c.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/patients/me/qr/:
    post:
      operationId: v1_patients_me_qr_create
      description: 설계문서 7.3절/3.1-f — POST /patients/me/qr. 일회성·5분 만료.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRToken'
          description: ''
  /api/v1/patients/me/reservations/:
    get:
      operationId: v1_patients_me_reservations_list
      description: |-
        설계문서 7.3절 — GET /patients/me/reservations. 3.1-b.

        POST는 설계문서 API 표에는 없지만(예약 신청 경로가 없으면 예약을
        아무도 못 만든다는 설계 공백), 예약 요청 흐름상 필요해서 추가했다.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
          description: ''
    post:
      operationId: v1_patients_me_reservations_create
      description: |-
        설계문서 7.3절 — GET /patients/me/reservations. 3.1-b.

        POST는 설계문서 API 표에는 없지만(예약 신청 경로가 없으면 예약을
        아무도 못 만든다는 설계 공백), 예약 요청 흐름상 필요해서 추가했다.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
  /api/v1/patients/me/visits/:
    get:
      operationId: v1_patients_me_visits_list
      description: 설계문서 7.3절 — GET /patients/me/visits. 진단명 포함.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
          description: ''
  /api/v1/patients/register/:
    post:
      operationId: v1_patients_register_create
      description: |-
        설계문서 3.1-a — 이메일/비밀번호 방식 환자 회원가입.
        카카오 소셜 로그인(POST /auth/social/{provider})은 별도로 나중에.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatientRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatientRegister'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
  /api/v1/prescriptions/{prescription_id}/:
    get:
      operationId: v1_prescriptions_retrieve
      description: 설계문서 7.3절 — GET /prescriptions/{id}. 처방전 상세 + 파일 서명 URL.
      parameters:
      - in: path
        name: prescription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/qr/verify/:
    post:
      operationId: v1_qr_verify_create
      description: 설계문서 7.4절 — POST /qr/verify. 태블릿 전용, 의료진 인증 필요.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRVerify'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/reservations/{reservation_id}/:
    get:
      operationId: v1_reservations_retrieve
      description: 설계문서 7.3절 — 예약 상세/변경/취소. 본인 예약만 접근 가능.
      parameters:
      - in: path
        name: reservation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
    patch:
      operationId: v1_reservations_partial_update
      description: 예약일 변경 — reservation_history 자동 기록.
      parameters:
      - in: path
        name: reservation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReservationReschedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReservationReschedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReservationReschedule'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
    delete:
      operationId: v1_reservations_destroy
      description: 예약 취소 — 물리 삭제가 아니라 status=CANCELED로 처리.
      parameters:
      - in: path
        name: reservation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/staff/:
