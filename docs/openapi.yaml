          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffMeUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
          description: ''
  /api/v1/uploads/signed-url/:
