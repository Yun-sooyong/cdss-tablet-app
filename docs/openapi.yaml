components:
  schemas:
    AnalysisShare:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        batch:
          type: string
          format: uuid
          readOnly: true
        shared_by:
          type: string
          format: uuid
          readOnly: true
        shared_to:
          type: string
          format: uuid
          readOnly: true
        permission:
          allOf:
          - $ref: '#/components/schemas/PermissionEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - batch
      - created_at
      - expires_at
      - id
      - permission
      - revoked_at
      - shared_by
      - shared_to
    AnalysisShareCreate:
      type: object
      properties:
        shared_to:
          type: string
          format: uuid
        permission:
          allOf:
          - $ref: '#/components/schemas/PermissionEnum'
          default: read
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - shared_to
    Batch:
      type: object
      description: |-
        patient는 UUID FK 그대로 두고, patient_summary에 판독용 최소 정보
        (이름/생년월일/성별)를 같이 내려준다 — 최일운 요청, 2026-08-04.
        이 batch에 접근 가능한 staff한테만 내려가므로(view의 권한 체크가
        이미 됨) 별도 권한 분기는 필요 없다.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        patient_summary:
          allOf:
          - $ref: '#/components/schemas/PatientSummary'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BatchStatusEnum'
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - patient
      - patient_summary
      - status
      - updated_at
    BatchCreate:
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
      required:
      - patient_id
    BatchStart:
      type: object
      properties:
        model_version_id:
          type: string
          format: uuid
    BatchStatusEnum:
      enum:
      - pending
      - processing
      - done
      - failed
      type: string
      description: |-
        * `pending` - 대기
        * `processing` - 처리중
        * `done` - 완료
        * `failed` - 실패
    DeviceToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fcm_token:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - fcm_token
      - id
      - platform
      - updated_at
    Diagnosis:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        disease:
          allOf:
          - $ref: '#/components/schemas/Disease'
          readOnly: true
        is_primary:
          type: boolean
          readOnly: true
      required:
      - disease
      - id
      - is_primary
    Disease:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        name_ko:
          type: string
          readOnly: true
        name_en:
          type: string
          readOnly: true
      required:
      - code
      - name_en
      - name_ko
    DoseLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        schedule:
          type: string
          format: uuid
          readOnly: true
        is_taken:
          type: boolean
          readOnly: true
        taken_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - is_taken
      - schedule
      - taken_at
    Drug:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        ingredient:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
      required:
      - code
      - ingredient
      - product_name
      - unit
    EmploymentStatusEnum:
      enum:
      - active
      - leave
      - resigned
      type: string
      description: |-
        * `active` - 재직
        * `leave` - 휴직
        * `resigned` - 퇴사
    ImageUploadRequest:
      type: object
      properties:
        original_filename:
          type: string
          maxLength: 255
      required:
      - original_filename
    ImageUploadResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        batch:
          type: string
          format: uuid
          readOnly: true
        storage_key:
          type: string
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        captured_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        upload_url:
          type: string
          format: uri
      required:
      - batch
      - captured_at
      - created_at
      - height
      - id
      - original_filename
      - storage_key
      - upload_url
      - width
    Invitation:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        department:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        is_used:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - department
      - expires_at
      - is_used
      - role
    InvitationIssue:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        department:
          type: string
          default: ''
          maxLength: 100
        expires_in_days:
          type: integer
          maximum: 30
          minimum: 1
          default: 7
      required:
      - role
    InvitationRedeem:
      type: object
      properties:
        code:
          type: string
          maxLength: 12
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - code
      - email
      - password
      - username
    Job:
      type: object
      description: |-
        job은 patient FK가 없어 image.batch.patient를 타고 올라가 요약을
        붙인다 — 최일운 요청, 2026-08-04. 파일명만 보이던 07·08·09 화면에
        환자 맥락이 붙는다.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
          format: uuid
          readOnly: true
        model_version:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatusEnum'
          readOnly: true
        result:
          readOnly: true
          nullable: true
        error_message:
          type: string
          readOnly: true
        patient_summary:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error_message
      - finished_at
      - id
      - image
      - model_version
      - patient_summary
      - result
      - started_at
      - status
    JobCallback:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/JobCallbackStatusEnum'
        result: {}
        error_message:
          type: string
          default: ''
      required:
      - status
    JobCallbackStatusEnum:
      enum:
      - stil_done
      - succeeded
      - failed
      type: string
      description: |-
        * `stil_done` - stil_done
        * `succeeded` - succeeded
        * `failed` - failed
    JobCreate:
      type: object
      properties:
        model_version_id:
          type: string
          format: uuid
    JobStatusEnum:
      enum:
      - queued
      - running
      - stil_done
      - succeeded
      - failed
      type: string
      description: |-
        * `queued` - 대기
        * `running` - 실행중
        * `stil_done` - sTIL 완료 (리포트 대기)
        * `succeeded` - 성공
        * `failed` - 실패
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    MedicationLogCreate:
      type: object
      properties:
        schedule_id:
          type: string
          format: uuid
      required:
      - schedule_id
    ModelVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        version:
          type: string
          readOnly: true
        conformal_q:
          type: number
          format: double
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        weight_key:
          type: string
          readOnly: true
        trained_at:
          type: string
          format: date
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - conformal_q
      - created_at
      - id
      - is_active
      - name
      - trained_at
      - version
      - weight_key
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        body:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - is_read
      - target_id
      - target_type
      - type
    PatchedPatient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
        sex:
          $ref: '#/components/schemas/SexEnum'
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedReservationReschedule:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
        change_reason:
          type: string
          default: ''
          maxLength: 200
    PatchedStaffMeUpdate:
      type: object
      description: 본인 정보 수정 — role은 권한 상승 위험이 있어 본인이 못 바꾸게 department만 허용.
      properties:
        department:
          type: string
          maxLength: 100
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
        sex:
          $ref: '#/components/schemas/SexEnum'
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - birth_date
      - created_at
      - id
      - name
      - phone
      - updated_at
    PatientRegister:
      type: object
      description: |-
        이메일/비밀번호 방식 환자 회원가입. 카카오 소셜 로그인은 별도(추후).

        별도 아이디(username) 없이 email을 로그인 식별자로 쓴다 — User.username에
        email 값을 그대로 저장(User 모델 자체는 안 바꿈, 로그인은 여전히
        POST /auth/login/에 username 필드로 보내되 값이 email인 것뿐).
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        name:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
        sex:
          allOf:
          - $ref: '#/components/schemas/SexEnum'
          default: U
        phone:
          type: string
          maxLength: 30
        address:
          type: string
          default: ''
          maxLength: 255
      required:
      - birth_date
      - email
      - name
      - password
      - phone
    PatientSummary:
      type: object
      description: |-
        batch/job 응답에 끼워 넣는 최소 정보 — "이 분석은 누구 것인지"
        판독 맥락용. 주소/전화번호처럼 더 민감한 필드는 넣지 않는다
        (최일운 요청, 2026-08-04).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        birth_date:
          type: string
          format: date
          readOnly: true
        sex:
          allOf:
          - $ref: '#/components/schemas/SexEnum'
          readOnly: true
      required:
      - birth_date
      - id
      - name
      - sex
    PermissionEnum:
      enum:
      - read
      - comment
      type: string
      description: |-
        * `read` - 읽기
        * `comment` - 댓글
    PlatformEnum:
      enum:
      - ios
      - android
      - web
      type: string
      description: |-
        * `ios` - iOS
        * `android` - Android
        * `web` - Web
    Prescription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        visit:
          type: string
          format: uuid
          readOnly: true
        staff:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        prescribed_at:
          type: string
          format: date
          readOnly: true
        file_url:
          type: string
          nullable: true
          readOnly: true
        drugs:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionDrug'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - drugs
      - file_url
      - id
      - prescribed_at
      - staff
      - visit
    PrescriptionDrug:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        drug:
          allOf:
          - $ref: '#/components/schemas/Drug'
          readOnly: true
        dose_per_take:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
        times_per_day:
          type: integer
          readOnly: true
        total_days:
          type: integer
          readOnly: true
      required:
      - dose_per_take
      - drug
      - id
      - times_per_day
      - total_days
    QRToken:
      type: object
      properties:
        token:
          type: string
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - issued_at
      - token
    QRVerify:
      type: object
      properties:
        token:
          type: string
          maxLength: 64
      required:
